name: Update data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download data
        run: |
          mkdir -p data
          get(){ if curl -fsSL --retry 3 "$2" -o "data/$1.tmp"; then mv "data/$1.tmp" "data/$1"; else echo "failed $1"; rm -f "data/$1.tmp"; fi; }
          B=https://pogoapi.net/api/v1
          get released.json $B/released_pokemon.json
          get shiny.json $B/shiny_pokemon.json
          get shadow.json $B/shadow_pokemon.json
          get names.json $B/pokemon_names.json
          get community_days.json $B/community_days.json
          get raid_exclusive.json $B/raid_exclusive_pokemon.json
          get types.json $B/pokemon_types.json
          get evolutions.json $B/pokemon_evolutions.json
          get events.json https://raw.githubusercontent.com/bigfoott/ScrapedDuck/data/events.min.json
          get grunts.json https://raw.githubusercontent.com/bigfoott/ScrapedDuck/data/rocketLineups.min.json
          get maxbattles.json https://pokemon-go-api.github.io/pokemon-go-api/api/maxbattles.json
          get raidboss.json https://pokemon-go-api.github.io/pokemon-go-api/api/raidboss.json
          get pokedex.json https://pokemon-go-api.github.io/pokemon-go-api/api/pokedex.json
          if curl -fsSL --retry 3 -A "GO-Lists-data-updater/1.0 (github.com/ksfv9b95wv-bit/pogo-costumes)" "https://bulbapedia.bulbagarden.net/w/api.php?action=parse&page=Dynamax_(GO)&prop=text&format=json&formatversion=2" -o data/dynamax_bp.tmp; then mv data/dynamax_bp.tmp data/dynamax_bp.json; else echo "failed dynamax_bp"; rm -f data/dynamax_bp.tmp; fi
          for f in data/*.json; do echo "=== $f ($(wc -c < "$f") bytes)"; head -c 1500 "$f"; echo; done > data/_samples.txt
      - name: Build slim Pokedex
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/pokedex.json'))
          nm=lambda x:(x.get('names') or {}).get('English') or x.get('id')
          im=lambda x:(x.get('assets') or {}).get('image','')
          C={'POKEMON_CLASS_LEGENDARY':'L','POKEMON_CLASS_MYTHIC':'M','POKEMON_CLASS_ULTRA_BEAST':'U'}
          out=[]
          for e in sorted(d,key=lambda e:(e['dexNr'],e['id'])):
              rf=e.get('regionForms') or {}
              if isinstance(rf,list): rf={(x.get('formId') or str(i)):x for i,x in enumerate(rf)}
              me=e.get('megaEvolutions') or []
              if isinstance(me,dict): me=list(me.values())
              ty=lambda x:x['type'].replace('POKEMON_TYPE_','').title() if x else None
              t=[v for v in (ty(e.get('primaryType')),ty(e.get('secondaryType'))) if v]
              r={'t':t,'i':e['dexNr'],'f':e['formId'],'n':nm(e),'c':C.get(e.get('pokemonClass'),''),'im':im(e)}
              if rf: r['rf']=[{'f':k,'n':nm(v),'im':im(v)} for k,v in rf.items()]
              if me: r['me']=[{'f':m.get('id'),'n':nm(m),'im':im(m)} for m in me]
              if e.get('hasGigantamaxEvolution'):
                  r['gm']=1
                  for a in e.get('assetForms') or []:
                      if a.get('form')=='GIGANTAMAX' and not a.get('isFemale'): r['gi']=a.get('image','')
              out.append(r)
          json.dump(out,open('data/dex.json','w'),separators=(',',':'),ensure_ascii=False)
          print(len(out),'entries')
          lg={'german':'de','french':'fr','spanish':'es','italian':'it','portug':'pt'}
          ni={}
          for e in d:
              i=e.get('dexNr')
              if not i or str(i) in ni: continue
              r={}
              for k,v in (e.get('names') or {}).items():
                  for a,b in lg.items():
                      if a in k.lower() and v: r[b]=v
              if r: ni[str(i)]=r
          json.dump(ni,open('data/names_i18n.json','w'),separators=(',',':'),ensure_ascii=False)
          print(len(ni),'translated names')
          PY
      - name: Build Dynamax list and data report
        run: |
          python3 - <<'PY'
          import json,re
          dex=json.load(open('data/dex.json'))
          byf={e['f']:e for e in dex}
          try: cur=json.load(open('data/maxbattles.json'))
          except Exception: cur={}
          try: old={e['i']:e for e in json.load(open('data/dynamax.json'))}
          except Exception: old={}
          acc=[]
          def walk(x):
              if isinstance(x,dict):
                  if isinstance(x.get('id'),str): acc.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(cur)
          for x in acc:
              e=byf.get(x['id'])
              if e and e['i'] not in old: old[e['i']]={'i':e['i'],'n':e['n'],'im':e['im']}
          # Bulbapedia "Dynamax (GO)" release table: every species that can be caught as Dynamax, with its date
          import html as H
          from datetime import datetime
          byn={}
          byi={}
          for e in dex: byi.setdefault(e['i'],e)
          for e in dex: byn.setdefault(e['n'].lower(),e)
          try:
              for v in json.load(open('data/names.json')).values():
                  x={'i':int(v['id']),'n':v['name'],'im':''};byn.setdefault(v['name'].lower(),x);byi.setdefault(x['i'],x)
          except Exception: pass
          bp=0
          try:
              t=json.load(open('data/dynamax_bp.json'))['parse']['text']
              if isinstance(t,dict): t=t.get('*','')
              mk=re.search(r'<h2[^>]*>(?:(?!</h2>).)*capable of Dynamaxing',t,re.S|re.I)
              if mk:
                  t=t[mk.start()+3:]
                  e2=t.find('<h2')
                  if e2>0: t=t[:e2]
              for row in t.split('<tr')[1:]:
                  txt=H.unescape(re.sub(r'<[^>]+>',' ',row))
                  m=re.search(r'([A-Z][a-z]{2,8})\.? (\d{1,2}), (\d{4})',txt)
                  if not m: continue
                  dt=None
                  for f in ('%B %d %Y','%b %d %Y'):
                      try: dt=int(datetime.strptime(m.group(1)+' '+m.group(2)+' '+m.group(3),f).strftime('%y%m%d')); break
                      except Exception: pass
                  if dt is None: continue
                  cells=row.split('<td')
                  pk=cells[2] if len(cells)>2 else row
                  hits=[int(n) for n in re.findall(r'/GO0*(\d{1,4})[A-Za-z_-]*\.png',pk)]
                  if not hits: hits=[byn[H.unescape(n).lower()]['i'] for n in re.findall(r'(?:alt|title)="([^"(]+?)(?: \((?:GO|Pok[^)]*)\))?"',pk) if H.unescape(n).lower() in byn]
                  for ix in dict.fromkeys(hits):
                      e=byi.get(ix)
                      if not e: continue
                      bp+=1
                      o=old.get(e['i'])
                      if o is None: old[e['i']]={'i':e['i'],'n':e['n'],'im':e.get('im',''),'d':dt}
                      elif 'd' not in o or o['d']>dt: o['d']=dt
          except Exception as x: print('bulbapedia parse failed',x)
          print('dynamax from bulbapedia',bp)
          json.dump(sorted(old.values(),key=lambda e:e['i']),open('data/dynamax.json','w'),separators=(',',':'),ensure_ascii=False)
          d=json.load(open('data/pokedex.json')); rel=json.load(open('data/released.json')); sh=json.load(open('data/shiny.json'))
          ids={e['dexNr'] for e in d}
          hs={e['dexNr'] for e in d if (e.get('assets') or {}).get('shinyImage')}
          nm=lambda i:(next((e['names']['English'] for e in d if e['dexNr']==i),str(i)))
          o=['dex %d, released %d, shiny %d, dynamax list %d (bulbapedia rows %d)'%(len(ids),len(rel),len(sh),len(old),bp)]
          o.append('RELEASED but not in pokedex.json: '+', '.join(rel[k]['name'] for k in rel if int(k) not in ids))
          o.append('HAS shiny image but NOT in shiny.json ('+str(len([i for i in hs if str(i) not in sh]))+'): '+', '.join(nm(i) for i in sorted(hs) if str(i) not in sh))
          o.append('IN shiny.json but no shiny image: '+', '.join(sh[k]['name'] for k in sh if int(k) not in hs))
          try: used=set(re.findall(r'\.c([A-Z0-9_]+)\.icon',open('costume-images.json').read()))
          except Exception: used=set()
          codes={}
          for e in d:
              for a in e.get('assetForms') or []:
                  c=a.get('costume')
                  if c and not a.get('isFemale') and c not in used: codes.setdefault(c,[]).append(str(e['dexNr']))
          o.append('COSTUME CODES not yet used ('+str(len(codes))+'): '+'; '.join(c+': '+','.join(v[:12]) for c,v in sorted(codes.items())))
          open('data/_report.txt','w').write('\n\n'.join(o))
          PY
      - name: Build PvP rankings (PvPoke)
        run: |
          set +e
          cat > /tmp/pvpbuild.py <<'PY'
          import json,re,math,sys,os
          root=sys.argv[1]; out=sys.argv[2]
          src=open(os.path.join(root,'src/js/pokemon/Pokemon.js')).read() if os.path.exists(os.path.join(root,'src/js/pokemon/Pokemon.js')) else None
          gm=json.load(open(os.path.join(root,'src/data/gamemaster.json')))
          cpms=json.loads(re.search(r'var cpms = (\[[^\]]+\])',src).group(1))
          def cpm(l): return cpms[int(round((l-1)*2))]
          def cp(b,l,a,d,s): return max(10,math.floor((b['atk']+a)*math.sqrt(b['def']+d)*math.sqrt(b['hp']+s)*cpm(l)**2/10))
          mv={m['moveId']:m['name'] for m in gm['moves']}
          M=[];Mi={}
          def mi(x):
            n=mv.get(x,str(x).title())
            if n not in Mi: Mi[n]=len(M);M.append(n)
            return Mi[n]
          R={}
          for lg,c in (('g',1500),('u',2500),('m',10000)):
            r=json.load(open(os.path.join(root,f'src/data/rankings/all/overall/rankings-{c}.json')))
            L=[e for e in r if not e['speciesId'].endswith('_shadow')]
            R[lg]={e['speciesId']:(i+1,e) for i,e in enumerate(L)}
          D={}
          for q in gm['pokemon']:
            sid=q['speciesId']
            if sid.endswith('_shadow') or '_mega' in sid: continue
            b=q['baseStats'];o={}
            for lg,key in (('g','cp1500'),('u','cp2500'),('m',None)):
              if sid not in R[lg]:continue
              rk,e=R[lg][sid];iv=(q.get('defaultIVs') or {}).get(key) if key else None
              iv=iv or [50,15,15,15]
              ms=list(e['moveset'])+[None]*3
              o[lg]=[rk,e['score'],mi(ms[0]),mi(ms[1]) if ms[1] else -1,mi(ms[2]) if ms[2] else -1,iv[0],iv[1],iv[2],iv[3],cp(b,iv[0],iv[1],iv[2],iv[3])]
            D.setdefault(str(q['dex']),[]).append([q['speciesName'],(q['types']+['none'])[:2],[b['atk'],b['def'],b['hp']],o,cp(b,50,15,15,15)])
          json.dump({'t':gm.get('timestamp',''),'m':M,'d':D},open(out,'w'),separators=(',',':'),ensure_ascii=False)
          print('pvp species',len(D),'entries',sum(len(v) for v in D.values()))
          PY
          P=https://raw.githubusercontent.com/pvpoke/pvpoke/master/src
          mkdir -p /tmp/pv/src/data/rankings/all/overall /tmp/pv/src/js/pokemon
          ok=1
          for f in data/gamemaster.json js/pokemon/Pokemon.js data/rankings/all/overall/rankings-1500.json data/rankings/all/overall/rankings-2500.json data/rankings/all/overall/rankings-10000.json; do
            curl -fsSL --retry 3 "$P/$f" -o "/tmp/pv/src/$f" || { echo "failed $f"; ok=0; }
          done
          if [ $ok = 1 ] && python3 /tmp/pvpbuild.py /tmp/pv data/pvp.tmp; then
            n=$(python3 -c "import json;print(sum(len(v) for v in json.load(open('data/pvp.tmp'))['d'].values()))")
            if [ "$n" -gt 900 ]; then mv data/pvp.tmp data/pvp.json; echo "pvp.json updated ($n entries)"; else echo "pvp too small ($n), kept old"; rm -f data/pvp.tmp; fi
          else echo "pvp build failed, kept old"; rm -f data/pvp.tmp; fi
          exit 0
      - name: Save data to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "Update data" || echo "nothing to commit"
          git push
