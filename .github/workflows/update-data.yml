name: Update data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download data
        run: |
          mkdir -p data
          get(){ if curl -fsSL --retry 3 "$2" -o "data/$1.tmp"; then mv "data/$1.tmp" "data/$1"; else echo "failed $1"; rm -f "data/$1.tmp"; fi; }
          B=https://pogoapi.net/api/v1
          get released.json $B/released_pokemon.json
          get shiny.json $B/shiny_pokemon.json
          get shadow.json $B/shadow_pokemon.json
          get names.json $B/pokemon_names.json
          get community_days.json $B/community_days.json
          get raid_exclusive.json $B/raid_exclusive_pokemon.json
          get types.json $B/pokemon_types.json
          get evolutions.json $B/pokemon_evolutions.json
          get events.json https://raw.githubusercontent.com/bigfoott/ScrapedDuck/data/events.min.json
          get maxbattles.json https://pokemon-go-api.github.io/pokemon-go-api/api/maxbattles.json
          get raidboss.json https://pokemon-go-api.github.io/pokemon-go-api/api/raidboss.json
          get pokedex.json https://pokemon-go-api.github.io/pokemon-go-api/api/pokedex.json
          for f in data/*.json; do echo "=== $f ($(wc -c < "$f") bytes)"; head -c 1500 "$f"; echo; done > data/_samples.txt
      - name: Build slim Pokedex
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/pokedex.json'))
          nm=lambda x:(x.get('names') or {}).get('English') or x.get('id')
          im=lambda x:(x.get('assets') or {}).get('image','')
          C={'POKEMON_CLASS_LEGENDARY':'L','POKEMON_CLASS_MYTHIC':'M','POKEMON_CLASS_ULTRA_BEAST':'U'}
          out=[]
          for e in sorted(d,key=lambda e:(e['dexNr'],e['id'])):
              rf=e.get('regionForms') or {}
              if isinstance(rf,list): rf={(x.get('formId') or str(i)):x for i,x in enumerate(rf)}
              me=e.get('megaEvolutions') or []
              if isinstance(me,dict): me=list(me.values())
              ty=lambda x:x['type'].replace('POKEMON_TYPE_','').title() if x else None
              t=[v for v in (ty(e.get('primaryType')),ty(e.get('secondaryType'))) if v]
              r={'t':t,'i':e['dexNr'],'f':e['formId'],'n':nm(e),'c':C.get(e.get('pokemonClass'),''),'im':im(e)}
              if rf: r['rf']=[{'f':k,'n':nm(v),'im':im(v)} for k,v in rf.items()]
              if me: r['me']=[{'f':m.get('id'),'n':nm(m),'im':im(m)} for m in me]
              if e.get('hasGigantamaxEvolution'):
                  r['gm']=1
                  for a in e.get('assetForms') or []:
                      if a.get('form')=='GIGANTAMAX' and not a.get('isFemale'): r['gi']=a.get('image','')
              out.append(r)
          json.dump(out,open('data/dex.json','w'),separators=(',',':'),ensure_ascii=False)
          print(len(out),'entries')
          PY
      - name: Build Dynamax list and data report
        run: |
          python3 - <<'PY'
          import json,re
          dex=json.load(open('data/dex.json'))
          byf={e['f']:e for e in dex}
          try: cur=json.load(open('data/maxbattles.json'))
          except Exception: cur={}
          try: old={e['i']:e for e in json.load(open('data/dynamax.json'))}
          except Exception: old={}
          acc=[]
          def walk(x):
              if isinstance(x,dict):
                  if isinstance(x.get('id'),str): acc.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(cur)
          for x in acc:
              e=byf.get(x['id'])
              if e and e['i'] not in old: old[e['i']]={'i':e['i'],'n':e['n'],'im':e['im']}
          json.dump(sorted(old.values(),key=lambda e:e['i']),open('data/dynamax.json','w'),separators=(',',':'),ensure_ascii=False)
          d=json.load(open('data/pokedex.json')); rel=json.load(open('data/released.json')); sh=json.load(open('data/shiny.json'))
          ids={e['dexNr'] for e in d}
          hs={e['dexNr'] for e in d if (e.get('assets') or {}).get('shinyImage')}
          nm=lambda i:(next((e['names']['English'] for e in d if e['dexNr']==i),str(i)))
          o=['dex %d, released %d, shiny %d, dynamax list %d'%(len(ids),len(rel),len(sh),len(old))]
          o.append('RELEASED but not in pokedex.json: '+', '.join(rel[k]['name'] for k in rel if int(k) not in ids))
          o.append('HAS shiny image but NOT in shiny.json ('+str(len([i for i in hs if str(i) not in sh]))+'): '+', '.join(nm(i) for i in sorted(hs) if str(i) not in sh))
          o.append('IN shiny.json but no shiny image: '+', '.join(sh[k]['name'] for k in sh if int(k) not in hs))
          try: used=set(re.findall(r'\.c([A-Z0-9_]+)\.icon',open('costume-images.json').read()))
          except Exception: used=set()
          codes={}
          for e in d:
              for a in e.get('assetForms') or []:
                  c=a.get('costume')
                  if c and not a.get('isFemale') and c not in used: codes.setdefault(c,[]).append(str(e['dexNr']))
          o.append('COSTUME CODES not yet used ('+str(len(codes))+'): '+'; '.join(c+': '+','.join(v[:12]) for c,v in sorted(codes.items())))
          open('data/_report.txt','w').write('\n\n'.join(o))
          PY
      - name: Save data to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "Update data" || echo "nothing to commit"
          git push
