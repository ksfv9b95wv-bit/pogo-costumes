name: Update data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download data
        run: |
          mkdir -p data
          get(){ if curl -fsSL --retry 3 "$2" -o "data/$1.tmp"; then mv "data/$1.tmp" "data/$1"; else echo "failed $1"; rm -f "data/$1.tmp"; fi; }
          B=https://pogoapi.net/api/v1
          get released.json $B/released_pokemon.json
          get shiny.json $B/shiny_pokemon.json
          get shadow.json $B/shadow_pokemon.json
          get names.json $B/pokemon_names.json
          get community_days.json $B/community_days.json
          get raid_exclusive.json $B/raid_exclusive_pokemon.json
          get types.json $B/pokemon_types.json
          get events.json https://raw.githubusercontent.com/bigfoott/ScrapedDuck/data/events.min.json
          get raidboss.json https://pokemon-go-api.github.io/pokemon-go-api/api/raidboss.json
          get pokedex.json https://pokemon-go-api.github.io/pokemon-go-api/api/pokedex.json
          for f in data/*.json; do echo "=== $f ($(wc -c < "$f") bytes)"; head -c 1500 "$f"; echo; done > data/_samples.txt
      - name: Build slim Pokedex
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/pokedex.json'))
          nm=lambda x:(x.get('names') or {}).get('English') or x.get('id')
          im=lambda x:(x.get('assets') or {}).get('image','')
          C={'POKEMON_CLASS_LEGENDARY':'L','POKEMON_CLASS_MYTHIC':'M','POKEMON_CLASS_ULTRA_BEAST':'U'}
          out=[]
          for e in sorted(d,key=lambda e:(e['dexNr'],e['id'])):
              rf=e.get('regionForms') or {}
              if isinstance(rf,list): rf={(x.get('formId') or str(i)):x for i,x in enumerate(rf)}
              me=e.get('megaEvolutions') or []
              if isinstance(me,dict): me=list(me.values())
              r={'i':e['dexNr'],'f':e['formId'],'n':nm(e),'c':C.get(e.get('pokemonClass'),''),'im':im(e)}
              if rf: r['rf']=[{'f':k,'n':nm(v),'im':im(v)} for k,v in rf.items()]
              if me: r['me']=[{'f':m.get('id'),'n':nm(m),'im':im(m)} for m in me]
              if e.get('hasGigantamaxEvolution'):
                  r['gm']=1
                  for a in e.get('assetForms') or []:
                      if a.get('form')=='GIGANTAMAX' and not a.get('isFemale'): r['gi']=a.get('image','')
              out.append(r)
          json.dump(out,open('data/dex.json','w'),separators=(',',':'),ensure_ascii=False)
          print(len(out),'entries')
          PY
      - name: Save data to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "Update data" || echo "nothing to commit"
          git push

