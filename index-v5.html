<title>GO Costume Checklist</title>
<style>
:root{--bg:#eaf0f9;--card:#fff;--ink:#07224E;--mute:#4f6487;--line:#cdd8ea;--have:#FFCB08;--havebg:#FFF6CC;--focus:#FFCB08;--sky1:#0B4DA2;--sky2:#07224E;--red:#E21C25}
@media(prefers-color-scheme:dark){:root{--bg:#061633;--card:#0d2a57;--ink:#eef3fb;--mute:#9db1d2;--line:#22427a;--have:#FFCB08;--havebg:#3a3410;--sky1:#0B4DA2;--sky2:#07224E}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Avenir Next",sans-serif}
header{position:sticky;top:0;z-index:5;color:#fff;background:linear-gradient(135deg,var(--sky1),var(--sky2));padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;border-radius:0 0 22px 22px;box-shadow:0 4px 14px rgba(10,60,100,.25)}
h1{font-size:21px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;font-weight:800;letter-spacing:.2px}
#count{font-size:14px;background:#FFCB08;color:#07224E;font-weight:700;padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.bar{height:10px;background:rgba(255,255,255,.28);border-radius:5px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:0;background:#FFCB08;border-radius:5px;transition:width .3s}
input[type=search]{width:100%;padding:11px 14px;font-size:16px;border:0;border-radius:999px;background:#fff;color:#16324a}
.srch{display:flex;gap:8px;align-items:center}
.srch input{flex:1;min-width:0}
#go{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:#FFCB08;font-size:18px;padding:0}
.tabs{display:flex;gap:8px;margin-top:10px}
.tabs button{flex:1;padding:9px;border:0;border-radius:999px;background:rgba(255,255,255,.22);color:#fff;font:inherit;font-weight:600}
.tabs button[aria-pressed=true]{background:#FFCB08;color:#07224E}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--focus);outline-offset:2px}
main{padding:6px 14px 20px}
h2{font-size:14px;margin:20px 0 8px;font-weight:700;display:inline-block;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:4px 12px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px}
label.c{display:grid;grid-template-columns:30px 46px minmax(0,1fr) 38px;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px;min-height:58px;cursor:pointer;transition:background .15s,border-color .15s}
label.c:has(input:checked){background:var(--havebg);border-color:var(--have)}
label.c input{appearance:none;-webkit-appearance:none;width:30px;height:30px;flex:none;margin:0;border-radius:50%;border:3px solid #2a3b4a;position:relative;background:linear-gradient(#cfd9e1 0 44%,#2a3b4a 44% 56%,#fff 56%)}
label.c input::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;border:3px solid #2a3b4a}
label.c input:checked{background:linear-gradient(var(--red) 0 44%,#2a3b4a 44% 56%,#fff 56%);animation:pop .25s ease-out}
@keyframes pop{50%{transform:scale(1.25)}}
@media(prefers-reduced-motion:reduce){label.c input:checked{animation:none}}
.av img{width:100%;height:100%;object-fit:contain}
.av{width:46px;height:46px;overflow:hidden;border-radius:14px;flex:none;color:#fff;font-size:13px;display:grid;place-items:center;font-weight:700}
label.c small{display:block;color:var(--mute);font-size:11.5px;font-weight:500;line-height:1.25;margin-top:3px}
label.c span{font-size:14px;line-height:1.2;font-weight:600}
#sort{width:100%;margin-top:10px;padding:10px 14px;font:inherit;border:0;border-radius:999px;background:rgba(255,255,255,.22);color:#fff}
#sort option{color:#07224E}
.look{width:38px;height:38px;display:grid;place-items:center;text-decoration:none;font-size:17px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.msg{padding:30px 0;color:var(--mute);text-align:center}
footer{padding:0 14px calc(env(safe-area-inset-bottom) + 30px);display:flex;gap:8px}
footer button{flex:1;padding:10px 12px;border:0;border-radius:999px;background:var(--sky1);color:#fff;font:inherit;font-weight:600}

/* GO theme v4 */
:root{--bg:#e6f6f2;--card:#fff;--ink:#16343a;--mute:#5d7a80;--line:#cfeae3;--have:#1fb89a;--havebg:#e9faf5;--sky1:#4fe0c0;--sky2:#14948f}
@media(prefers-color-scheme:dark){:root{--bg:#08201f;--card:#0f3535;--ink:#e8fbf7;--mute:#97c2bd;--line:#1c5559;--havebg:#124340;--sky1:#14948f;--sky2:#0b5f5f}}
body{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
header{background:radial-gradient(circle at 94% -6%,rgba(255,255,255,.3) 0 46px,rgba(255,255,255,.12) 47px 52px,transparent 53px),linear-gradient(165deg,#4fe0c0,#14948f)}
#count{background:#fff;color:#14948f}
.bar{height:12px}.bar i{background:linear-gradient(90deg,#ffd23f,#ffb300)}
.tabs button{background:rgba(255,255,255,.22);font-weight:700}.tabs button[aria-pressed=true]{background:#fff;color:#14948f}
#go{background:#ffd23f}
h2{background:linear-gradient(90deg,#14948f,#38d6b3);color:#fff;border:0;box-shadow:0 2px 6px rgba(20,148,143,.3)}
label.c{grid-template-columns:30px 54px minmax(0,1fr) 38px;border:0;border-radius:24px;box-shadow:0 3px 0 var(--line),0 8px 16px rgba(20,148,143,.1)}
label.c:has(input:checked){background:var(--havebg);box-shadow:inset 0 0 0 3px var(--have),0 8px 16px rgba(20,148,143,.15)}
.av{width:54px;height:54px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #8fe0cf;background:radial-gradient(circle at 50% 30%,#fff,#bdeee3)}
.av img{filter:grayscale(1) brightness(.6) opacity(.75)}
label.c:has(input:checked) .av img{filter:none}
label.c span{font-weight:700}
footer button{background:#14948f}

/* v5 GO Pokedex theme */
:root{--bg:#8fd8ef;--card:rgba(255,255,255,.4);--ink:#1578a6;--mute:#4f8fb0;--line:rgba(255,255,255,.6);--havebg:rgba(255,255,255,.78);--have:#ffc928}
@media(prefers-color-scheme:dark){:root{--bg:#0a4668;--card:rgba(255,255,255,.1);--ink:#d9f2ff;--mute:#8fc0dc;--line:rgba(255,255,255,.2);--havebg:rgba(255,255,255,.22)}}
html{background:var(--bg)}
body{background:linear-gradient(180deg,#bdf0f1 0,#8fd8ef 45%,#5fc4ec 100%) fixed;color:var(--ink)}
@media(prefers-color-scheme:dark){body{background:linear-gradient(180deg,#0d6b86 0,#0a4668 50%,#072f4c 100%) fixed}}
header{position:sticky;top:calc(env(safe-area-inset-top) + 6px);margin:calc(env(safe-area-inset-top) + 6px) 10px 0;padding:12px 14px;border-radius:26px;background:rgba(255,255,255,.62);color:var(--ink);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.7);box-shadow:0 6px 18px rgba(21,120,166,.18)}
@media(prefers-color-scheme:dark){header{background:rgba(10,50,80,.7)}}
h1{color:var(--ink);letter-spacing:.5px}
#count{background:#1380b5;color:#fff;font-size:16px;padding:5px 16px}
.bar{background:rgba(19,128,181,.2)}.bar i{background:#1380b5}
input[type=search]{background:rgba(255,255,255,.9);border:2px solid rgba(19,128,181,.15)}

#go{background:#1380b5;color:#fff}
h2{background:rgba(255,255,255,.65);color:#1578a6;box-shadow:none;border:2px solid rgba(255,255,255,.8)}
.grid{grid-template-columns:repeat(2,1fr);gap:10px}
label.c{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;padding:12px 8px 12px;min-height:170px;background:var(--card);border:2px solid var(--line);border-radius:24px;box-shadow:none}

.av{width:92px;height:92px;border:0;box-shadow:none;background:none;margin:6px 0 4px}

label.c small{color:var(--mute);font-size:11px}
footer button{background:#1380b5}
