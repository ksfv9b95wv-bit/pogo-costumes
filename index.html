<title>GO Costume Checklist</title>
<style>

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Avenir Next",sans-serif}
header{position:sticky;top:0;z-index:5;color:#fff;background:linear-gradient(135deg,var(--sky1),var(--sky2));padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;border-radius:0 0 22px 22px;box-shadow:0 4px 14px rgba(10,60,100,.25)}
h1{font-size:21px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;font-weight:800;letter-spacing:.2px}
#count{font-size:14px;background:#FFCB08;color:#07224E;font-weight:700;padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.bar{height:10px;background:rgba(255,255,255,.28);border-radius:5px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:0;background:#FFCB08;border-radius:5px;transition:width .3s}
input[type=search]{width:100%;padding:11px 14px;font-size:16px;border:0;border-radius:999px;background:#fff;color:#16324a}
.srch{display:flex;gap:8px;align-items:center}
.srch input{flex:1;min-width:0}
#go{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:#FFCB08;font-size:18px;padding:0}
.tabs{display:flex;gap:8px;margin-top:10px}
.tabs button{flex:1;padding:9px;border:0;border-radius:999px;background:rgba(255,255,255,.22);color:#fff;font:inherit;font-weight:600}
.tabs button[aria-pressed=true]{background:#FFCB08;color:#07224E}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--focus);outline-offset:2px}
main{padding:6px 14px 20px}
h2{font-size:14px;margin:20px 0 8px;font-weight:700;display:inline-block;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:4px 12px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px}
label.c{display:grid;grid-template-columns:30px 36px minmax(0,1fr) 38px;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px;min-height:58px;cursor:pointer;transition:background .15s,border-color .15s}
label.c:has(input:checked){background:var(--havebg);border-color:var(--have)}
label.c input{appearance:none;-webkit-appearance:none;width:30px;height:30px;flex:none;margin:0;border-radius:50%;border:3px solid #2a3b4a;position:relative;background:linear-gradient(#cfd9e1 0 44%,#2a3b4a 44% 56%,#fff 56%)}
label.c input::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;border:3px solid #2a3b4a}
label.c input:checked{background:linear-gradient(var(--red) 0 44%,#2a3b4a 44% 56%,#fff 56%);animation:pop .25s ease-out}
@keyframes pop{50%{transform:scale(1.25)}}
@media(prefers-reduced-motion:reduce){label.c input:checked{animation:none}}
.av{width:36px;height:36px;border-radius:12px;flex:none;color:#fff;font-size:13px;display:grid;place-items:center;font-weight:700}
label.c small{display:block;color:var(--mute);font-size:11.5px;font-weight:500;line-height:1.25;margin-top:3px}
label.c span{font-size:14px;line-height:1.2;font-weight:600}
#sort{width:100%;margin-top:10px;padding:10px 14px;font:inherit;border:0;border-radius:999px;background:rgba(255,255,255,.22);color:#fff}
#sort option{color:#07224E}
.look{width:38px;height:38px;display:grid;place-items:center;text-decoration:none;font-size:17px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.msg{padding:30px 0;color:var(--mute);text-align:center}
footer{padding:0 14px calc(env(safe-area-inset-bottom) + 30px);display:flex;gap:8px}
footer button{flex:1;padding:10px 12px;border:0;border-radius:999px;background:var(--sky1);color:#fff;font:inherit;font-weight:600}
</style>
</head>

</header>

<footer>

  <button id="imp">Restore</button>

async function initDb(){
 try{
  if(!window.claude||!claude.use)return;
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db||!user)return;
  const uid=await user.id();if(!uid)return;
  const ref=db.collection("data/users/"+uid).doc("state");
  const snap=await ref.get();
  if(snap.exists){
   const d=snap.data()||{};
   (d.owned||[]).forEach(x=>owned.add(x));

   (d.custom||[]).forEach(c=>{if(!ids.has(c.id))custom.push(c)});
   data=[...SEED,...custom];
  }
  store=ref;save();render();
 }catch(e){}

const $=(s)=>document.querySelector(s);

function render(){
  const q=query.trim().toLowerCase();
  const rows=data.filter(d=>{
    const has=owned.has(d.id);
    if(filter==="have"&&!has)return false;
    if(filter==="need"&&has)return false;
    return !q||(d.name+" "+d.event).toLowerCase().includes(q);
  });
  const groups=new Map();
  const by=sortMode==="pokemon";if(sortMode==="newest")rows.reverse();else if(sortMode==="costume")rows.sort((a,b)=>a.event.localeCompare(b.event)||a.name.localeCompare(b.name));else if(by)rows.sort((a,b)=>a.name.localeCompare(b.name)||a.event.localeCompare(b.event));for(const d of rows){const k=by?d.name:d.event;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(d)}
  const list=$("#list");list.textContent="";
  if(!rows.length){list.innerHTML='<p class="msg">Nothing matches.</p>'}
  for(const [event,items] of groups){
    const h=document.createElement("h2");
    h.textContent=`${event} (${items.filter(i=>owned.has(i.id)).length}/${items.length})`;
    const g=document.createElement("div");g.className="grid";
    for(const d of items){
      const l=document.createElement("label");l.className="c";
      const cb=document.createElement("input");cb.type="checkbox";cb.checked=owned.has(d.id);
      cb.onchange=()=>{cb.checked?owned.add(d.id):owned.delete(d.id);save();stats();if(filter!=="all")render();else h.textContent=`${event} (${items.filter(i=>owned.has(i.id)).length}/${items.length})`};
      const s=document.createElement("span");s.textContent=by?d.event:d.name;{const sm=document.createElement("small");sm.textContent=info(d);if(sm.textContent)s.append(sm)}const av=document.createElement("b");av.className="av";av.textContent=d.name.replace(/[^A-Za-zÀ-ÿ]/g,"").slice(0,2);av.style.background="hsl("+([...d.name].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360)+" 45% 40%)";
      const a=document.createElement("a");a.textContent="🔍";a.title="See what it looks like";a.target="_blank";a.rel="noopener";a.className="look";a.href="https://www.google.com/search?tbm=isch&q="+encodeURIComponent("Pokémon GO "+d.event+" "+d.name);l.append(cb,av,s,a);g.append(l);
    }
    list.append(h,g);
  }
  stats();
}
const yr=x=>{const m=/(\d{4})\)?\s*$/.exec(x||"");return m?+m[1]:0};
function info(d){if(String(d.id).startsWith("custom:"))return "Added by you";if(!d.f&&!d.l)return "Dates not listed in sources";const y=yr(d.l);const st=y>=2026?"Seen in 2026":y===2025?"Seen in 2025":"Probably trade only";return "Released: "+d.f+" \u00b7 Last seen: "+d.l+" \u00b7 "+st}
function stats(){
  const n=data.filter(d=>owned.has(d.id)).length;
  $("#count").textContent=`${n} / ${data.length}`;
  $("#fill").style.width=data.length?(100*n/data.length)+"%":"0";
}
$("#q").oninput=e=>{query=e.target.value;render()};
$("#tabs").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  filter=b.dataset.f;
  document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  render();
};
$("#exp").onclick=async()=>{
  const t=JSON.stringify([...owned]);
  try{await navigator.clipboard.writeText(t);alert("Copied. Paste it into Notes to keep a backup.")}
  catch(e){prompt("Copy this backup:",t)}
};
$("#imp").onclick=()=>{
  const t=prompt("Paste your backup:");if(!t)return;
  try{const a=JSON.parse(t);if(!Array.isArray(a))throw 0;owned=new Set(a);save();render()}
  catch(e){alert("That doesn't look like a valid backup.")}
};
$("#go").onclick=()=>{$("#q").blur();window.scrollTo({top:0,behavior:"smooth"})};
$("#q").onkeydown=e=>{if(e.key==="Enter")$("#q").blur()};
$("#sort").onchange=e=>{sortMode=e.target.value;render()};
initDb();
$("#add").onclick=()=>{
  const name=prompt("Pokémon name (e.g. Eevee)");if(!name)return;
  const label=prompt("Costume (e.g. Explorer Hat)")||"";
  const event=prompt("Event (e.g. Halloween 2024)")||"Other";
  const id="custom:"+Date.now();
  custom.push({id,dex:0,name:name.trim(),label:label.trim(),event:event.trim()});
  try{localStorage.setItem("pogo-custom",JSON.stringify(custom))}catch(e){}save();
  data=[...SEED,...custom];render();
};
render();
</script>
</body>
